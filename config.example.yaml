# ============================================================
# 成绩分析与报告生成引擎 —— 配置模板（全部为虚构示例值）
# 复制为 config.yaml 后按实际情况填写；删除注释不影响解析。
# ============================================================

# —— 基本信息（必填）——
school: "示例学校"            # 学校显示名，将出现在报告标题与说明中
class_name: "示例年级1班"      # 班级显示名
term: "示例学年第一学期"       # 学期描述
update_date: "2026-01-01"     # 报告生成日期（建议用当天）
analyst: "教务处"             # 署名/来源，可留空

# —— 考试链条（必填）——
# 2 次：期初 + 期中；1 次：仅期中。名称需与 Excel 中该考总分列的命名片段一致。
exam_chain:
  - "期初"
  - "期中"

# —— 学科与满分（必填）——
# key 是学科名，full 是该科满分，sections 是板块及满分（用于得分率与薄弱诊断）。
subjects:
  语文:
    full: 150
    sections:
      阅读: 40
      古诗文: 35
      语言文字: 25
      作文: 50
  数学:
    full: 150
    sections:
      选择: 40
      填空: 20
      解答: 90
  英语:
    full: 150
    sections:
      听力: 30
      阅读: 40
      完形: 15
      语法: 15
      写作: 50

# —— 输入 Excel 列契约（必填）——
# 左边是引擎内部字段名，右边是 Excel 表头实际文字。按你自己的表头改右边。
input:
  columns:
    name: "姓名"
    sid: "学号"
    rank: "校内排名"          # 用于层次折算的校内排名列
    # 每科两考总分列：约定 {内部字段} 对应实际表头
    totals:
      语文: {期初: "语文期初", 期中: "语文期中"}
      数学: {期初: "数学期初", 期中: "数学期中"}
      英语: {期初: "英语期初", 期中: "英语期中"}
    # 板块得分率列（选填，单位：百分数 0-100）。没有就不填此段，薄弱诊断将跳过。
    section_rates:
      语文:
        期中: {阅读: "语文阅读率期中", 作文: "语文作文率期中"}
        期初: {阅读: "语文阅读率期初", 作文: "语文作文率期初"}
      数学:
        期中: {选择: "数学选择率期中", 解答: "数学解答率期中"}
        期初: {选择: "数学选择率期初", 解答: "数学解答率期初"}
      英语:
        期中: {听力: "英语听力率期中", 写作: "英语写作率期中"}
        期初: {听力: "英语听力率期初", 写作: "英语写作率期初"}

# —— 层次折算规则（必填）——
# 按「校内排名 <= max」从小到大匹配，命中第一条即停；max 为 null 表示兜底。
# tier 名称、颜色、说明均可自定义。全省位次为经验估算，文档会标注仅供参考。
tier_rules:
  - max: 50
    tier: "拔尖层"
    color: "#FCE4D6"
    desc: "校内前 50 名，经验折算约对应重点线以上"
  - max: 150
    tier: "稳步层"
    color: "#E2EFDA"
    desc: "校内 51–150 名，经验折算约对应本科线以上"
  - max: null
    tier: "攻坚层"
    color: "#DDEBF7"
    desc: "其余学生，建议夯实基础、稳步推进"
missing_tier: "数据不全"      # 排名缺失时的层次标签

# —— 院校推荐（选填）——
# 按层次给 2–3 所适配院校；不需要可整段删除。
school_recommend:
  拔尖层:
    - {name: "示例大学A", note: "示例说明，请替换为本地院校"}
  稳步层:
    - {name: "示例大学B", note: "示例说明，请替换为本地院校"}
  攻坚层:
    - {name: "示例学院C", note: "示例说明，请替换为本地院校"}

# —— 诊断归因（选填）——
# 板块 -> 薄弱归因与训练建议；未列出的板块使用通用文案。
weak_reasons:
  作文: {cause: "审题与结构训练不足", advice: "每周一次限时提纲训练"}
  解答: {cause: "综合题思路与步骤规范待加强", advice: "按题型归类错题，限时复做"}
  写作: {cause: "语篇连贯与语言准确性不足", advice: "建立个人表达库，两周一次面批"}
default_reason: {cause: "该板块基础巩固不足", advice: "回归基础，按知识点清单逐条过关"}

# —— 个人报告 PDF 联动（选填）——
# 启用后交互 HTML 会生成「查看报告」列；PDF 文件需使用者自行放入 HTML 同目录。
pdf_report:
  enabled: false
  filename_pattern: "report_{name}.pdf"   # {name} 会替换为学生的 name 列值
  note: "报告正文由使用者自行生成，本引擎不产出 PDF 内容"
